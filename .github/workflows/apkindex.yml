name: Generate APKINDEX and Sign

on:
  push:
    branches: [stable]
    paths:
      - 'x86_64/*.apk'
  pull_request:
    branches: [stable]
    paths:
      - 'x86_64/*.apk'

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: self-hosted

    steps:
      - name: Checkout (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS files are present (no pointer files)
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs pull

          shopt -s nullglob
          files=(x86_64/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APKs found in x86_64/. Nothing to index."
            exit 1
          fi

          # Fail fast if any APK is still an LFS pointer
          if grep -q -m1 'git-lfs.github.com/spec/v1' "${files[@]}"; then
            echo "ERROR: LFS pointer files detected in x86_64/. Did you push LFS objects?" >&2
            exit 1
          fi

          echo "Showing first up to 20 APKs:"
          for f in "${files[@]:0:20}"; do ls -lh "$f"; done

      - name: Restore signing key
        shell: bash
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}   # base64 of myrepo.rsa
        run: |
          set -euo pipefail
          install -d -m 700 "$GITHUB_WORKSPACE/keys"
          # decode to file (single-line b64 secret recommended)
          printf '%s' "$APK_SIGN_KEY" | tr -d '\r\n' | base64 -d > "$GITHUB_WORKSPACE/keys/myrepo.rsa"
          chmod 600 "$GITHUB_WORKSPACE/keys/myrepo.rsa"

      - name: Generate APKINDEX.tar.gz and sign
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE/x86_64:/repo" \
            -v "$GITHUB_WORKSPACE/keys/myrepo.rsa:/key/myrepo.rsa:ro" \
            agnios/alpine-agnios-image:latest \
            sh -lc '
              set -euo pipefail
              apk add --no-cache alpine-sdk abuild openssl
              cd /repo
              shopt -s nullglob
              set -- *.apk
              [ "$#" -gt 0 ] || { echo "No APKs found in /repo"; exit 1; }

              # build index for the APKs in /repo
              apk index -o APKINDEX.tar.gz "$@"

              # sign index (produces APKINDEX.tar.gz.sig)
              abuild-sign -k /key/myrepo.rsa APKINDEX.tar.gz

              ls -lh APKINDEX.tar.gz APKINDEX.tar.gz.sig
            '

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x86_64/APKINDEX.tar.gz x86_64/APKINDEX.tar.gz.sig
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update APKINDEX and signature"
            git push
          fi
